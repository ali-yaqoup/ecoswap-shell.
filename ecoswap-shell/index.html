<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoSwap — Shell (Group 11)</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="shell-header">
      <div class="brand" data-app="catalog">EcoSwap</div>

      <nav class="shell-nav">
        <button class="nav-btn" data-app="catalog" type="button">Shop</button>
        <button class="nav-btn" data-app="cart" type="button">
          Cart
          <span class="badge" id="cart-badge" hidden>0</span>
        </button>
        <button class="nav-btn" data-app="account" type="button">Account</button>
      </nav>
    </header>

    <main class="shell-main">
      <iframe
        id="frame-catalog"
        class="app-frame"
        title="Catalog & Discovery"
      ></iframe>
      <iframe
        id="frame-cart"
        class="app-frame"
        title="Cart & Checkout"
      ></iframe>
      <iframe
        id="frame-account"
        class="app-frame"
        title="Account & Orders"
      ></iframe>
    </main>

    <div id="toast" class="toast" hidden></div>

    <script src="shell.js"></script>
  </body>
</html>
